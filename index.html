<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>마디마디</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <section class="hero">
      <h1>마디마디</h1>
      <p>자세와 음성을 분석하는 발표 코칭 서비스</p>
      <div class="button-group">
        <button id="startBtn">분석 시작</button>
        <button id="stopBtn">분석 종료</button>
      </div>
    </section>
    <section class="analysis-layout">
      <div class="camera-card">
        <h2>카메라 분석</h2>
        <div class="camera-box">
          <video id="webcam" autoplay playsinline></video>
          <canvas id="outputCanvas"></canvas>
        </div>
      </div>
      <div class="feedback-card">
        <h2>실시간 피드백</h2>
        <div class="status-box">
          <p>상태: <span id="statusText">대기 중</span></p>
          <p>발표 시간: <span id="timerText">0초</span></p>
        </div>
        <h3>자세 피드백</h3>
        <ul id="poseFeedbackList">
          <li>아직 분석을 시작하지 않았습니다.</li>
        </ul>
        <h3>음성 인식 결과</h3>
        <p id="speechText">아직 인식된 음성이 없습니다.</p>
        <h3>음성 피드백</h3>
        <p id="speechFeedback">아직 분석 전입니다.</p>
        <h3>최종 발표 리포트</h3>
        <div id="finalReport" class="final-report">아직 발표가 종료되지 않았어요.</div>
      </div>
    </section>
  </main>
  <script type="module" src="script.js"></script>
</body>
</html>
